# ====================================================================
# NGINX REVERSE PROXY CHO LOGISTIC SYSTEM
# ====================================================================
# Kiến trúc:  Internet -> Nginx (:443) -> gateway_service (:8080) -> gRPC nội bộ
#
# Nginx CHỈ nói chuyện với gateway. Các service nội bộ (user, vehicle, matching,
# notification) không mở ra Internet — chúng nằm trong mạng logistic_net và chỉ
# nhận gRPC từ gateway.
#
# Cách dùng trên Server (Ubuntu):
# 1. sudo cp nginx/logistic.conf /etc/nginx/sites-available/logistic
# 2. sudo ln -s /etc/nginx/sites-available/logistic /etc/nginx/sites-enabled/
# 3. sudo rm -f /etc/nginx/sites-enabled/default
# 4. sudo nginx -t && sudo systemctl reload nginx
# ====================================================================

# Vùng giới hạn tần suất, khai báo ở cấp http (nằm ngoài server block).
# api    : 30 req/s cho API thường.
# gps    : 60 req/s vì app tài xế ping GPS vài giây một lần cho MỖI xe —
#          dùng chung ngưỡng với API thường sẽ chặn nhầm tài xế đang chạy thật.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=gps_zone:10m rate=60r/s;

upstream logistic_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name gobackend.glolog.dev localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gobackend.glolog.dev localhost;

    ssl_certificate     /etc/nginx/ssl/cloudflare.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Chặn upload quá lớn ngay tại biên, khỏi tốn công gateway đọc hết body.
    client_max_body_size 20m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1000;

    # Header truy vết: gateway đọc X-Request-Id, nếu không có thì tự sinh.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ----------------------------------------------------------------
    # XOÁ HEADER DANH TÍNH DO CLIENT TỰ KHAI
    # ----------------------------------------------------------------
    # X-User-Id / X-User-Role là header NỘI BỘ: gateway tự ghi chúng sau khi
    # verify chữ ký JWT. Không có ba dòng dưới đây, một client bên ngoài gửi
    #
    #     curl -H "X-User-Role: admin" https://.../api/v1/admin/users
    #
    # và header đó đi thẳng tới gateway. Đó chính là lỗ hổng của bản trước.
    #
    # Gateway CŨNG tự xoá chúng (middleware.StripClientIdentity) — hai lớp là cố
    # ý. Lớp ở đây chặn sớm nhất có thể; lớp trong gateway vẫn đứng vững nếu mai
    # sau ai đó dựng gateway sau một load balancer khác, cấu hình theo cách khác.
    #
    # Chuỗi rỗng trong nginx nghĩa là KHÔNG chuyển tiếp header đó lên upstream.
    proxy_set_header X-User-Id    "";
    proxy_set_header X-User-Role  "";
    proxy_set_header X-User-Email "";

    # ----------------------------------------------------------------
    # HEALTH CHECK — không rate limit, không ghi log cho đỡ nhiễu
    # ----------------------------------------------------------------
    location = /healthz {
        proxy_pass http://logistic_gateway/healthz;
        access_log off;
    }

    # ----------------------------------------------------------------
    # BÁO VỊ TRÍ GPS — ngưỡng riêng, cao hơn hẳn
    # ----------------------------------------------------------------
    # Khớp đúng dạng /api/v1/vehicles/<id>/location. Đặt TRƯỚC location /api/
    # vì nginx ưu tiên regex theo thứ tự khai báo.
    location ~ ^/api/v1/vehicles/[^/]+/location$ {
        limit_req zone=gps_zone burst=120 nodelay;
        proxy_pass http://logistic_gateway;
    }

    # ----------------------------------------------------------------
    # KHU VỰC QUẢN TRỊ
    # ----------------------------------------------------------------
    # Quyền thật sự do middleware.RequireRole("admin") ở gateway quyết định.
    # Ở đây chỉ siết thêm rate limit và cấm cache — đây là lớp phòng thủ phụ,
    # KHÔNG phải lớp xác thực.
    location /api/v1/admin/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://logistic_gateway;

        add_header Cache-Control "no-store" always;
    }

    # ----------------------------------------------------------------
    # API CHUNG
    # ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://logistic_gateway;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ----------------------------------------------------------------
    # SWAGGER UI
    # ----------------------------------------------------------------
    location /swagger/ {
        proxy_pass http://logistic_gateway;
    }

    location / {
        proxy_pass http://logistic_gateway;
    }
}
