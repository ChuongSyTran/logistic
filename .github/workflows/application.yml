name: 'Application Pipeline Job'

# Định nghĩa các sự kiện (triggers) sẽ kích hoạt luồng CI/CD này
on:
  push:
    branches: [ "main" ]
    # BỎ QUA không chạy luồng này nếu chỉ sửa đổi các file hạ tầng hoặc tài liệu
    paths-ignore:
      - 'terraform/**'
      - 'README.md'
      - 'docs/**'
  # Trigger tay — cần cho 2 trường hợp paths-filter KHÔNG thể tự phát hiện được:
  # (1) chỉ đổi giá trị 1 GitHub Secret (không có file nào đổi trong repo để diff),
  # (2) muốn deploy lại đúng 1 service cụ thể (kể cả service không phải Go, ví dụ
  #     elasticsearch/kibana — paths-filter phía dưới không theo dõi các service đó).
  workflow_dispatch:
    inputs:
      service:
        description: >-
          Tên service trong docker-compose.yml muốn deploy (vd. "elasticsearch",
          "auth-service"). Để "all" = reconcile toàn bộ stack theo compose file.
          Để "auto" = theo diff so với commit trước (giống push, ít dùng khi chạy tay).
        required: true
        default: 'all'
        type: string

# Ngăn chặn đụng độ (Race Condition) nếu có nhiều người push code cùng lúc
# Các luồng deploy app sẽ xếp hàng chạy lần lượt (cancel-in-progress: false)
concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

# Quyền cho GITHUB_TOKEN:
#   contents: read  -> checkout code
#   packages: write -> push image lên GHCR (ghcr.io). Không cần tạo PAT riêng.
permissions:
  contents: read
  packages: write

env:
  # Tiền tố registry. GHCR bắt buộc CHỮ THƯỜNG toàn bộ, nên hardcode lowercase
  # (github.repository trả về "TranSenpai/logistic" có chữ hoa => không dùng trực tiếp được).
  # Giá trị này phải khớp y hệt key image: trong docker-compose.yml.
  REGISTRY_PREFIX: ghcr.io/transenpai/logistic

jobs:
  # ===========================================================================
  # JOB 1: DETECT — "Nội soi" xem Dev vừa sửa code ở thư mục nào
  # ---------------------------------------------------------------------------
  # Tách riêng thành 1 job để CẢ job build lẫn job deploy đều dùng chung được
  # kết quả, khỏi phải chạy paths-filter hai lần.
  # ===========================================================================
  detect:
    name: 'Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      # Mảng JSON tên thư mục service cần build image, để đổ vào strategy.matrix
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      # Có service nào cần build không (nếu không thì skip hẳn job build)
      has_builds: ${{ steps.plan.outputs.has_builds }}
      # Danh sách tên service trong compose cần restart (cách nhau bởi dấu cách)
      services_to_restart: ${{ steps.plan.outputs.services_to_restart }}
      # Có reconcile toàn bộ stack theo compose file không
      full_reconcile: ${{ steps.plan.outputs.full_reconcile }}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Tool 'dorny/paths-filter' trả về kết quả True/False cho từng mục
    - name: Check Changed Files
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:
            - 'auth_service/**'
          gateway:
            - 'gateway_service/**'
          matching:
            - 'matching_service/**'
          media:
            - 'media_service/**'
          notification:
            - 'notification_service/**'
          user:
            - 'user_service/**'
          vehicle:
            - 'vehicle_service/**'
          wallet:
            - 'wallet_service/**'
          # Code dùng chung (pkg, api) — được 7 service Go import qua directive
          # `replace` trong go.mod, nên đổi ở đây phải BUILD LẠI cả 8 image.
          # Thêm Dockerfile/.dockerignore vì chúng ảnh hưởng trực tiếp tới image.
          shared_code:
            - 'pkg/**'
            - 'api/**'
            - '.dockerignore'
            - '.env.example'
            - '.github/workflows/application.yml'
          # docker-compose.yml đổi có thể ảnh hưởng BẤT KỲ service nào trong file,
          # kể cả service không phải Go (elasticsearch, kibana, db...) — không đoán
          # danh sách cố định, để compose tự đối chiếu toàn bộ.
          compose:
            - 'docker-compose.yml'

    # -------------------------------------------------------------------------
    # Chốt kế hoạch: build image nào, restart service nào
    # -------------------------------------------------------------------------
    - name: Plan Build & Deploy
      id: plan
      run: |
        set -euo pipefail

        BUILD_DIRS=""          # tên THƯ MỤC (user_service) -> dùng để build
        SERVICES=""            # tên trong COMPOSE (user-service) -> dùng để restart
        FULL_RECONCILE="false"

        # Tất cả 7 service Go, dùng khi cần build/restart toàn bộ
        ALL_DIRS="auth_service gateway_service matching_service media_service notification_service user_service vehicle_service wallet_service"
        ALL_SVCS="auth-service gateway-service matching-service media-service notification-service user-service vehicle-service wallet-service"

        if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.service }}" != 'auto' ]]; then
          # Trigger tay: dùng đúng giá trị người chạy chọn, bỏ qua paths-filter.
          if [[ "${{ inputs.service }}" == 'all' ]]; then
            FULL_RECONCILE="true"
            BUILD_DIRS="$ALL_DIRS"
          else
            SERVICES="${{ inputs.service }}"
            # Chỉ build lại nếu tên đó đúng là 1 service Go của mình.
            # Gõ tay "elasticsearch"/"kibana" thì không có image nào để build,
            # chỉ cần restart container theo compose là đủ.
            DIR_GUESS="$(echo "${{ inputs.service }}" | tr '-' '_')"
            if [[ " $ALL_DIRS " == *" $DIR_GUESS "* ]]; then
              BUILD_DIRS="$DIR_GUESS"
            fi
          fi
        elif [[ "${{ steps.filter.outputs.compose }}" == 'true' ]]; then
          # docker-compose.yml đổi: để podman-compose tự đối chiếu toàn bộ file,
          # thay vì đoán thủ công service nào bị ảnh hưởng.
          FULL_RECONCILE="true"
          # Compose đổi thì thường chỉ là port/env/volume => không nhất thiết build lại.
          # Nhưng nếu commit đó ĐỒNG THỜI đụng vào code thì vẫn phải build image mới.
          if [[ "${{ steps.filter.outputs.shared_code }}" == 'true' ]]; then
            BUILD_DIRS="$ALL_DIRS"
          else
            if [[ "${{ steps.filter.outputs.auth }}"     == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS auth_service";     fi
            if [[ "${{ steps.filter.outputs.gateway }}"  == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS gateway_service";  fi
            if [[ "${{ steps.filter.outputs.matching }}" == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS matching_service"; fi
            if [[ "${{ steps.filter.outputs.media }}"    == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS media_service";    fi
            if [[ "${{ steps.filter.outputs.notification }}" == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS notification_service"; fi
            if [[ "${{ steps.filter.outputs.user }}"     == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS user_service";     fi
            if [[ "${{ steps.filter.outputs.vehicle }}"  == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS vehicle_service";  fi
            if [[ "${{ steps.filter.outputs.wallet }}"   == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS wallet_service";  fi
          fi
        elif [[ "${{ steps.filter.outputs.shared_code }}" == 'true' ]]; then
          # Code dùng chung (pkg/api) đổi: build lại + restart cả 8 service Go.
          BUILD_DIRS="$ALL_DIRS"
          SERVICES="$ALL_SVCS"
        else
          # Trái lại, soi từng nhánh, nhánh nào đổi thì nối vào cả 2 danh sách
          if [[ "${{ steps.filter.outputs.auth }}"     == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS auth_service";     SERVICES="$SERVICES auth-service";     fi
          if [[ "${{ steps.filter.outputs.gateway }}"  == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS gateway_service";  SERVICES="$SERVICES gateway-service";  fi
          if [[ "${{ steps.filter.outputs.matching }}" == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS matching_service"; SERVICES="$SERVICES matching-service"; fi
          if [[ "${{ steps.filter.outputs.media }}"    == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS media_service";    SERVICES="$SERVICES media-service";    fi
          if [[ "${{ steps.filter.outputs.notification }}" == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS notification_service"; SERVICES="$SERVICES notification-service"; fi
          if [[ "${{ steps.filter.outputs.user }}"     == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS user_service";     SERVICES="$SERVICES user-service";     fi
          if [[ "${{ steps.filter.outputs.vehicle }}"  == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS vehicle_service";  SERVICES="$SERVICES vehicle-service";  fi
          if [[ "${{ steps.filter.outputs.wallet }}"   == 'true' ]]; then BUILD_DIRS="$BUILD_DIRS wallet_service";  SERVICES="$SERVICES wallet-service";  fi
        fi

        # Gọt khoảng trắng thừa
        BUILD_DIRS="$(echo $BUILD_DIRS | xargs || true)"
        SERVICES="$(echo $SERVICES | xargs || true)"

        # Đổi "a b c" -> ["a","b","c"] cho strategy.matrix nuốt được
        if [[ -z "$BUILD_DIRS" ]]; then
          MATRIX='[]'
          HAS_BUILDS='false'
        else
          MATRIX="$(printf '%s' "$BUILD_DIRS" | tr ' ' '\n' | sort -u \
                    | awk 'BEGIN{printf "["} {printf "%s\"%s\"", (NR>1 ? "," : ""), $0} END{printf "]"}')"
          HAS_BUILDS='true'
        fi

        echo "build_matrix=$MATRIX"                 >> "$GITHUB_OUTPUT"
        echo "has_builds=$HAS_BUILDS"               >> "$GITHUB_OUTPUT"
        echo "services_to_restart=$SERVICES"        >> "$GITHUB_OUTPUT"
        echo "full_reconcile=$FULL_RECONCILE"       >> "$GITHUB_OUTPUT"

        echo "::notice::Build images: ${MATRIX} | Restart: '${SERVICES}' | Full reconcile: ${FULL_RECONCILE}"

  # ===========================================================================
  # JOB 2: BUILD & PUSH — Runner đóng gói image, đẩy lên GHCR
  # ---------------------------------------------------------------------------
  # Toàn bộ việc biên dịch Go nằm TRONG Dockerfile (stage 1) và chạy TRÊN RUNNER
  # của GitHub (4 vCPU / 16GB, miễn phí). EC2 t3.large đang gánh Kafka×6 +
  # Elasticsearch×2 + MySQL×2 + Postgres×4 nên tuyệt đối không bắt nó compile.
  # EC2 chỉ pull image đã build sẵn => cũng không cần đưa source code lên EC2.
  # ===========================================================================
  build-push:
    name: 'Build & Push (${{ matrix.service }})'
    needs: detect
    if: needs.detect.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Một service lỗi thì vẫn để các service khác build xong, dễ nhìn log hơn
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '${{ matrix.service }}/go.mod'
        cache-dependency-path: '${{ matrix.service }}/go.sum'

    # -------------------------------------------------------------------------
    # CHỐT CHẶN go.work: bảo đảm module đứng MỘT MÌNH vẫn build được
    # -------------------------------------------------------------------------
    # Đây là cái bẫy mà sách "Learning Go" (2nd ed., ch.10) cảnh báo: go.work
    # khiến mọi thứ chạy ngon ở máy local, vì workspace gộp chung module graph
    # và ghi hash vào go.work.sum. Nhưng trong Docker ta build với GOWORK=off,
    # lúc đó Go chỉ đọc go.mod + go.sum RIÊNG của module — nếu go.sum thiếu hash
    # thì build vỡ với lỗi "missing go.sum entry".
    # Chạy trước ở đây để fail sớm trong ~20s kèm thông báo rõ ràng, thay vì
    # fail sau vài phút giữa lúc docker build.
    - name: Verify module builds standalone (GOWORK=off)
      run: |
        set -euo pipefail
        cd "${{ matrix.service }}"
        # -mod=readonly (mặc định) => Go KHÔNG được tự sửa go.mod/go.sum để chữa cháy,
        # thiếu gì là báo lỗi ngay. Đúng thứ ta muốn kiểm tra.
        GOWORK=off GOFLAGS=-mod=readonly CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o /dev/null ./cmd
        echo "OK: ${{ matrix.service }} tự build được, không cần go.work."

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Tên image trong compose dùng dấu gạch NGANG (user-service), còn thư mục
    # dùng gạch DƯỚI (user_service) => quy đổi ở đây.
    - name: Resolve image name
      id: img
      run: echo "name=$(echo '${{ matrix.service }}' | tr '_' '-')" >> "$GITHUB_OUTPUT"

    - name: Build & Push image
      uses: docker/build-push-action@v6
      with:
        # Context = GỐC REPO (không phải thư mục service), vì go.mod của service
        # có `replace github.com/logistic/api => ../api` trỏ ra ngoài thư mục đó.
        context: .
        file: ${{ matrix.service }}/Dockerfile
        push: true
        # Tag theo git sha để pin chính xác + tag latest cho tiện tra cứu
        tags: |
          ${{ env.REGISTRY_PREFIX }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          ${{ env.REGISTRY_PREFIX }}/${{ steps.img.outputs.name }}:latest
        # Cache layer qua GitHub Actions cache: lần build sau chỉ compile lại
        # phần code thực sự đổi, không tải lại toàn bộ module Go.
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,scope=${{ matrix.service }},mode=max
        provenance: false

  # ===========================================================================
  # JOB 3: DEPLOY — Mở firewall, đẩy file cấu hình, pull image, restart
  # ===========================================================================
  deploy:
    name: 'Deploy Application'
    needs: [detect, build-push]
    # always() để job này VẪN chạy khi build-push bị skip (trường hợp chỉ đổi
    # docker-compose.yml hay deploy tay elasticsearch — không có image nào để build).
    # Nhưng nếu build-push đã CHẠY và THẤT BẠI thì dừng, không deploy image hỏng.
    if: always() && needs.detect.result == 'success' && needs.build-push.result != 'failure' && !cancelled()
    runs-on: ubuntu-latest
    steps:
    # -------------------------------------------------------------
    # BƯỚC 1: Kéo mã nguồn (chỉ để lấy docker-compose.yml, nginx/, config/, scripts/)
    # -------------------------------------------------------------
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # -------------------------------------------------------------
    # BƯỚC 2: Đăng nhập AWS và Lấy IP của máy chủ EC2 đang chạy
    # Dùng Terraform để lấy IP mới nhất trên S3 State, giúp pipeline
    # không bao giờ bị hardcode IP.
    # -------------------------------------------------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: ./terraform/compute
      run: terraform init

    - name: Get EC2 IP Address & Security Group ID
      id: get_ip
      working-directory: ./terraform/compute
      run: |
        # Đọc IP và ID của Security Group từ AWS và lưu vào biến môi trường Github
        IP=$(terraform output -raw server_logistic_ip)
        echo "EC2_IP=$IP" >> $GITHUB_ENV
        SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=logistic-security-group --query 'SecurityGroups[0].GroupId' --output text)
        echo "SG_ID=$SG_ID" >> $GITHUB_ENV

    # -------------------------------------------------------------
    # BƯỚC 3: Mở cổng Firewall (Cổng 22 - SSH) tạm thời cho Github Runner
    # -------------------------------------------------------------
    - name: Get GitHub Runner IP
      id: ip
      uses: haythem/public-ip@v1.3

    - name: Allow Runner IP to Security Group
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ env.SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

    # Tạo thư mục gốc trên EC2 trước để lát SCP copy vào không bị lỗi
    - name: Create working directory on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/ubuntu/logistic

    # -------------------------------------------------------------
    # BƯỚC 4: Truyền file cấu hình (SCP)
    # -------------------------------------------------------------
    # Giờ EC2 KHÔNG build gì nữa nên KHÔNG cần source code Go, cũng không cần
    # Dockerfile. Chỉ đẩy đúng những thứ container cần lúc chạy:
    #   docker-compose.yml : định nghĩa stack
    #   config/            : file cấu hình cho Postgres/MySQL master-slave
    #   nginx/             : reverse proxy
    #   scripts/           : script khởi tạo DB
    # => nhẹ hơn hẳn so với trước, và mã nguồn không bao giờ nằm trên EC2.
    - name: Copy Runtime Files to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        source: "config/,nginx/,scripts/,docker-compose.yml"
        target: "/home/ubuntu/logistic"

    # -------------------------------------------------------------
    # BƯỚC 5: SSH vào EC2, pull image từ GHCR rồi restart
    # -------------------------------------------------------------
    - name: Generate .env & Deploy Podman
      uses: appleboy/ssh-action@v1.0.3
      env:
        SERVICES_TO_RESTART: ${{ needs.detect.outputs.services_to_restart }}
        FULL_RECONCILE: ${{ needs.detect.outputs.full_reconcile }}
        # GITHUB_TOKEN chỉ sống trong thời gian job chạy — đủ để podman login
        # kéo image private về, hết job là token vô hiệu. Không cần tạo PAT.
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        envs: SERVICES_TO_RESTART,FULL_RECONCILE,GHCR_USER,GHCR_TOKEN
        script: |
          set -euo pipefail
          cd /home/ubuntu/logistic

          echo "Waiting for podman to be fully installed..."
          while ! command -v podman &> /dev/null; do sleep 5; done

          # [Tạo file .env từ Github Secrets]
          cat << 'EOF' > .env
          NATS_HOST=${{ secrets.NATS_HOST }}
          NATS_PORT=${{ secrets.NATS_PORT }}
          KAFKA_KRAFT_CLUSTER_ID=${{ secrets.KAFKA_KRAFT_CLUSTER_ID }}
          KAFKA_BROKERS=${{ secrets.KAFKA_BROKERS }}
          GATEWAY_PORT=${{ secrets.GATEWAY_PORT }}
          GATEWAY_AUTH_GRPC_ADDR=${{ secrets.GATEWAY_AUTH_GRPC_ADDR }}
          GATEWAY_MATCHING_GRPC_ADDR=${{ secrets.GATEWAY_MATCHING_GRPC_ADDR }}
          GATEWAY_USER_GRPC_ADDR=${{ secrets.GATEWAY_USER_GRPC_ADDR }}
          GATEWAY_VEHICLE_GRPC_ADDR=${{ secrets.GATEWAY_VEHICLE_GRPC_ADDR }}
          GATEWAY_MEDIA_GRPC_ADDR=${{ secrets.GATEWAY_MEDIA_GRPC_ADDR }}
          AUTH_SERVICE_GRPC_PORT=${{ secrets.AUTH_SERVICE_GRPC_PORT }}
          AUTH_SERVICE_JWT_SECRET=${{ secrets.AUTH_SERVICE_JWT_SECRET }}
          AUTH_SERVICE_DB_DRIVER=${{ secrets.AUTH_SERVICE_DB_DRIVER }}
          AUTH_SERVICE_DB_HOST=${{ secrets.AUTH_SERVICE_DB_HOST }}
          AUTH_SERVICE_DB_PORT=${{ secrets.AUTH_SERVICE_DB_PORT }}
          AUTH_SERVICE_DB_USER=${{ secrets.AUTH_SERVICE_DB_USER }}
          AUTH_SERVICE_DB_PASSWORD=${{ secrets.AUTH_SERVICE_DB_PASSWORD }}
          AUTH_SERVICE_DB_NAME=${{ secrets.AUTH_SERVICE_DB_NAME }}
          AUTH_SERVICE_DB_ROOT_PASSWORD=${{ secrets.AUTH_SERVICE_DB_ROOT_PASSWORD }}
          AUTH_DB_REPLICATION_USER=${{ secrets.AUTH_DB_REPLICATION_USER }}
          AUTH_DB_REPLICATION_PASSWORD=${{ secrets.AUTH_DB_REPLICATION_PASSWORD }}
          AUTH_SERVICE_GOOGLE_CLIENT_ID=${{ secrets.AUTH_SERVICE_GOOGLE_CLIENT_ID }}
          AUTH_SERVICE_GOOGLE_CLIENT_SECRET=${{ secrets.AUTH_SERVICE_GOOGLE_CLIENT_SECRET }}
          AUTH_SERVICE_GOOGLE_REDIRECT_URL=${{ secrets.AUTH_SERVICE_GOOGLE_REDIRECT_URL }}
          MATCHING_SERVICE_GRPC_PORT=${{ secrets.MATCHING_SERVICE_GRPC_PORT }}
          MATCHING_SERVICE_DB_DRIVER=${{ secrets.MATCHING_SERVICE_DB_DRIVER }}
          MATCHING_DB_USER=${{ secrets.MATCHING_DB_USER }}
          MATCHING_DB_PASSWORD=${{ secrets.MATCHING_DB_PASSWORD }}
          MATCHING_DB_NAME=${{ secrets.MATCHING_DB_NAME }}
          MATCHING_DB_MASTER_HOST=${{ secrets.MATCHING_DB_MASTER_HOST }}
          MATCHING_DB_MASTER_PORT=${{ secrets.MATCHING_DB_MASTER_PORT }}
          MATCHING_DB_SLAVE_HOST=${{ secrets.MATCHING_DB_SLAVE_HOST }}
          MATCHING_DB_SLAVE_PORT=${{ secrets.MATCHING_DB_SLAVE_PORT }}
          MATCHING_DB_REPLICATION_USER=${{ secrets.MATCHING_DB_REPLICATION_USER }}
          MATCHING_DB_REPLICATION_PASSWORD=${{ secrets.MATCHING_DB_REPLICATION_PASSWORD }}
          MEDIA_SERVICE_GRPC_PORT=${{ secrets.MEDIA_SERVICE_GRPC_PORT }}
          MEDIA_SERVICE_CLOUDINARY_URL=${{ secrets.MEDIA_SERVICE_CLOUDINARY_URL }}
          USER_SERVICE_PORT=${{ secrets.USER_SERVICE_PORT }}
          USER_DB_USER=${{ secrets.USER_DB_USER }}
          USER_DB_PASSWORD=${{ secrets.USER_DB_PASSWORD }}
          USER_DB_HOST=${{ secrets.USER_DB_HOST }}
          USER_DB_PORT=${{ secrets.USER_DB_PORT }}
          USER_DB_NAME=${{ secrets.USER_DB_NAME }}
          USER_DB_REPLICATION_USER=${{ secrets.USER_DB_REPLICATION_USER }}
          USER_DB_REPLICATION_PASSWORD=${{ secrets.USER_DB_REPLICATION_PASSWORD }}
          VEHICLE_SERVICE_PORT=${{ secrets.VEHICLE_SERVICE_PORT }}
          VEHICLE_DB_USER=${{ secrets.VEHICLE_DB_USER }}
          VEHICLE_DB_PASSWORD=${{ secrets.VEHICLE_DB_PASSWORD }}
          VEHICLE_DB_HOST=${{ secrets.VEHICLE_DB_HOST }}
          VEHICLE_DB_PORT=${{ secrets.VEHICLE_DB_PORT }}
          VEHICLE_DB_NAME=${{ secrets.VEHICLE_DB_NAME }}
          VEHICLE_DB_REPLICATION_USER=${{ secrets.VEHICLE_DB_REPLICATION_USER }}
          VEHICLE_DB_REPLICATION_PASSWORD=${{ secrets.VEHICLE_DB_REPLICATION_PASSWORD }}
          WALLET_SERVICE_GRPC_PORT=${{ secrets.WALLET_SERVICE_GRPC_PORT }}
          WALLET_SERVICE_DB_NAME=${{ secrets.WALLET_SERVICE_DB_NAME }}
          WALLET_SERVICE_DB_USER=${{ secrets.WALLET_SERVICE_DB_USER }}
          WALLET_SERVICE_DB_PASSWORD=${{ secrets.WALLET_SERVICE_DB_PASSWORD }}
          WALLET_SERVICE_DB_ROOT_PASSWORD=${{ secrets.WALLET_SERVICE_DB_ROOT_PASSWORD }}
          WALLET_SERVICE_DB_DSN=${{ secrets.WALLET_SERVICE_DB_DSN }}
          WALLET_SERVICE_KAFKA_BROKERS=${{ secrets.WALLET_SERVICE_KAFKA_BROKERS }}
          WALLET_SERVICE_ES_ADDRESSES=${{ secrets.WALLET_SERVICE_ES_ADDRESSES }}
          WALLET_SERVICE_ES_USERNAME=${{ secrets.WALLET_SERVICE_ES_USERNAME }}
          WALLET_SERVICE_ES_PASSWORD=${{ secrets.WALLET_SERVICE_ES_PASSWORD }}
          MATCHING_WALLET_GRPC_ADDR=${{ secrets.MATCHING_WALLET_GRPC_ADDR }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          ELASTIC_PASSWORD=${{ secrets.ELASTIC_PASSWORD }}
          KIBANA_PASSWORD=${{ secrets.KIBANA_PASSWORD }}
          EOF

          # IMAGE_TAG được docker-compose.yml đọc qua ${IMAGE_TAG:-latest}.
          # Ghim theo git sha => biết chính xác container đang chạy commit nào,
          # và rollback chỉ là sửa 1 dòng trong .env rồi up -d lại.
          echo "IMAGE_TAG=${{ github.sha }}" >> .env

          # Kích hoạt linger để các tiến trình của user ubuntu không bị kill khi SSH ngắt kết nối
          sudo loginctl enable-linger ubuntu

          chmod -R +x scripts/

          echo "Configuring Nginx with Cloudflare SSL..."
          sudo mkdir -p /etc/nginx/ssl
          echo "${{ secrets.CLOUDFLARE_CERT_PEM }}" | sudo tee /etc/nginx/ssl/cloudflare.pem > /dev/null
          echo "${{ secrets.CLOUDFLARE_CERT_KEY }}" | sudo tee /etc/nginx/ssl/cloudflare.key > /dev/null
          sudo chmod 600 /etc/nginx/ssl/cloudflare.key

          sudo cp nginx/logistic.conf /etc/nginx/sites-available/logistic
          sudo ln -sf /etc/nginx/sites-available/logistic /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl reload nginx

          # Đăng nhập GHCR để kéo được image private của repo
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

          if [ "$FULL_RECONCILE" = "true" ]; then
            # Không truyền tên service nào => podman-compose tự đối chiếu TOÀN BỘ
            # docker-compose.yml, chỉ recreate đúng service nào cấu hình thực sự đổi.
            echo "Reconciling full stack against docker-compose.yml..."
            podman-compose pull || true
            podman-compose up -d
          elif [ -z "$SERVICES_TO_RESTART" ]; then
            # List rỗng => commit không đụng tới source code service nào
            echo "No service changes detected. Skipping container restarts."
          else
            # Kéo image mới (tag = sha vừa build) rồi restart đúng service đã đổi.
            # KHÔNG dùng --build: EC2 không có source, image đã build sẵn trên runner.
            echo "Pulling & restarting services: $SERVICES_TO_RESTART"
            podman-compose pull $SERVICES_TO_RESTART
            podman-compose up -d $SERVICES_TO_RESTART
          fi

          # Dọn image cũ không còn tag để ổ đĩa 30GB không bị đầy dần sau mỗi lần deploy
          podman image prune -f || true

          # Xoá credential GHCR khỏi EC2, không để token nằm lại trên máy
          podman logout ghcr.io || true

    # -------------------------------------------------------------
    # BƯỚC 6: Xóa IP của Github Runner khỏi Firewall để bảo mật
    # Lệnh `if: always()` đảm bảo bước này luôn chạy kể cả khi pipeline bị lỗi
    # -------------------------------------------------------------
    - name: Revoke Runner IP from Security Group
      if: always()
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ env.SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32
