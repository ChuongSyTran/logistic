version: v2
plugins:
  # Plugin sinh code Go cho các Struct
  - local: protoc-gen-go
    out: ../api
    opt: paths=source_relative
  # Plugin sinh code gRPC Client/Server cho Go
  - local: protoc-gen-go-grpc
    out: ../api
    opt: paths=source_relative
  # Plugin sinh code grpc-gateway (Reverse Proxy)
  - local: protoc-gen-grpc-gateway
    out: ../api
    opt: paths=source_relative
  # Plugin sinh file Swagger/OpenAPI
  - local: protoc-gen-openapiv2
    out: ../api/swagger