# ============================================================================
# RANH GIỚI MẠNG — điều kiện tiên quyết của mô hình xác thực
# ============================================================================
# CHỈ gateway-service publish cổng ra máy chủ. Sáu service nội bộ chỉ nghe trong
# mạng logistic_net, không có ánh xạ cổng nào.
#
# Đây KHÔNG phải chuyện dọn dẹp cho gọn. Gateway verify JWT rồi chuyển danh tính
# xuống dưới qua gRPC metadata, còn service nội bộ TIN metadata đó mà không kiểm
# lại (xem pkg/authn/grpcmeta.go để biết vì sao). Giả định này chỉ đúng khi không
# ai gọi thẳng vào được. Trước đây mỗi service đều publish cổng gRPC của mình,
# nên bất kỳ ai chạm tới máy chủ đều bỏ qua được gateway và tự xưng là admin.
#
# Cần gỡ lỗi một service? Dùng `docker compose exec` hoặc mở cổng tạm thời trong
# một file override riêng cho máy local — đừng thêm `ports:` lại vào đây.
# ============================================================================
networks:
  logistic_net:
    driver: bridge

services:
  gateway-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: gateway_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/gateway-service:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
      # Gateway chỉ được gắn PUBLIC key. Nếu ai đó vô tình mount nhầm private
      # key vào đây, gateway sẽ ký được token — mất trắng ranh giới đặc quyền.
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    networks:
      - logistic_net

  auth-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: auth_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/auth-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      auth-db-master:
        condition: service_healthy
    volumes:
      - auth-data:/app/data
      # PRIVATE key chỉ mount vào auth_service, và chỉ đọc.
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    networks:
      - logistic_net
  
  media-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: media_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/media-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    volumes:
      - media-data:/app/data
    networks:
      - logistic_net

  matching-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: matching_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/matching-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      matching-db-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_started
      broker-1:
        condition: service_started
      broker-2:
        condition: service_started
      broker-3:
        condition: service_started
    volumes:
      - matching-data:/app/data
    networks:
      - logistic_net

  user-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: user_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/user-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      user-db-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - user-data:/app/data
    networks:
      - logistic_net

  vehicle-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: vehicle_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/vehicle-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      vehicle-db-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - vehicle-data:/app/data
    networks:
      - logistic_net


  notification-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      context: .
      dockerfile: notification_service/Dockerfile
    image: ghcr.io/transenpai/logistic/notification-service:${IMAGE_TAG:-latest}
    env_file:
      - .env
    # Consumer chỉ bind được queue khi RabbitMQ đã sẵn sàng. Không có
    # depends_on healthy thì lần khởi động đầu tiên gần như chắc chắn trượt và
    # phải chờ vòng reconnect.
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-db:
        condition: service_started
    volumes:
      - notification-data:/app/data
    networks:
      - logistic_net

  # ==========================================================================
  # JAEGER — nơi trace thực sự XEM ĐƯỢC
  # ==========================================================================
  # Trước đây mọi service đều đã gắn OpenTelemetry, nhưng KHÔNG có gì nhận trace
  # và OTEL_EXPORTER_OTLP_ENDPOINT thì để trống — SDK rơi về localhost:4317, bên
  # trong container không có ai nghe. BatchSpanProcessor nuốt lỗi gửi trong im
  # lặng, nên nhìn log thì tưởng mọi thứ vẫn ổn: cả hệ thống có đủ mã trace mà
  # không xem được cái nào.
  #
  # Container này đóng đúng lỗ đó. Đặt OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
  # trong .env là trace bắt đầu chảy về.
  #
  # all-in-one giữ trace TRONG BỘ NHỚ và mất sạch khi restart — hoàn toàn ổn cho
  # môi trường phát triển. Lên production thì thay bằng OTel Collector đứng
  # trước một backend có lưu trữ, và bật lấy mẫu; giữ 100% trace ở nhịp GPS thật
  # sẽ tốn hơn cả chính hệ thống đang được đo.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # giao diện web: http://localhost:16686
      - "4317:4317"   # OTLP gRPC — cổng mà pkg/tracer gửi tới
    networks:
      - logistic_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # REDIS — cache đọc + CHỈ MỤC GEO cho "tìm xe đang chạy"
  # ==========================================================================
  # Ba service dùng chung một instance nhưng TÁCH database index và key prefix:
  #   db 0 = user_service     (cache hồ sơ, địa chỉ, thiết bị)
  #   db 1 = vehicle_service  (cache xe + sorted set GEO của xe đang online)
  #   db 2 = notification_service (bộ đếm thông báo chưa đọc)
  #
  # appendonly yes: chỉ mục GEO dựng lại từ Postgres được, nhưng AOF giúp sau
  # khi restart không có khoảng trống mà mọi xe đều "biến mất" khỏi kết quả tìm.
  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: redis
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      # allkeys-lru: khi đầy thì loại key ít dùng nhất. An toàn vì Redis ở đây
      # KHÔNG phải nguồn sự thật — mọi thứ đều dựng lại được từ Postgres.
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - logistic_net

  # ==========================================================================
  # RABBITMQ — hàng đợi thông báo matching_service -> notification_service
  # ==========================================================================
  # Topology (exchange, queue, binding, DLQ) được code tự khai báo lúc khởi động
  # (xem pkg/mq/rabbitmq.go DeclareTopology), nên ở đây không cần definitions.json.
  # Giao diện quản trị: http://localhost:15672
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:U
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - logistic_net

  # ==========================================================================
  # NOTIFICATION DB
  # ==========================================================================
  # Chỉ một node: bảng notifications ghi nhiều đọc ít, và dữ liệu không mang
  # tính giao dịch tiền bạc như matching/wallet nên chưa cần replica.
  notification-db:
    image: docker.io/library/postgres:16-alpine
    container_name: notification-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistic_net

  matching-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-master
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      POSTGRES_DB: ${MATCHING_DB_NAME}
      REPLICATION_USER: ${MATCHING_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c" # Config file
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - matching-db-master-data:/var/lib/postgresql/data
      - ./config/matching_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      # Thư mục /docker-entrypoint-initdb.d/ là điểm neo (hook) khởi tạo của Image PostgreSQL.
      # Bất kỳ script (.sh, .sql) nào được mount vào đây sẽ tự động được thực thi 1 lần 
      # duy nhất trong giai đoạn bootstrap (khi thư mục data còn trống).
      # Script register-replica.sh được dùng để cấp phát User Replication và cập nhật pg_hba.conf trước khi DB mở port kết nối.
      - ./scripts/matching_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${MATCHING_DB_USER} -d ${MATCHING_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  matching-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-slave
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      PGPASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
      REPLICATION_USER: ${MATCHING_DB_REPLICATION_USER}
    depends_on:
      - matching-db-master
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./scripts/matching_service/db/start-replica.sh:/scripts/matching_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/matching_service/db/start-replica.sh"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${MATCHING_DB_USER} -d ${MATCHING_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  nats:
    image: docker.io/library/nats:2.10-alpine
    container_name: nats-server
    command: 
      - "-js"           # Kích hoạt chế độ JetStream
      - "-sd"           # Cờ chỉ định Store Directory
      - "/data"         # Thư mục lưu trữ JetStream data
      - "-m"            # Cờ -m <port> (viết tắt của --http_port): Dùng để ra lệnh cho NATS mở một cổng HTTP để bạn có thể xem các thông số Monitor (Giám sát).
      - "8222"          # Kích hoạt cổng Monitor Web
    ports:
      - "4222:4222"     # Port giao tiếp của Client
      - "8222:8222"     # Port giao tiếp HTTP Monitor
    volumes:
      - nats-data:/data # Ánh xạ Volume vào đúng thư mục đã chỉ định
    networks:
      - logistic_net

  controller-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-2
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-3
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-4:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-4
    ports:
      - 49093:9092
    environment:
      KAFKA_NODE_ID: 7
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-4:19092,PLAINTEXT_HOST://localhost:49093'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-4-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-5:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-5
    ports:
      - 49094:9092
    environment:
      KAFKA_NODE_ID: 8
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-5:19092,PLAINTEXT_HOST://localhost:49094'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
