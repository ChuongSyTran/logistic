      - ./scripts/vehicle_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${VEHICLE_DB_USER} -d ${VEHICLE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  vehicle-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: vehicle-db-slave
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: ${VEHICLE_DB_USER}
      POSTGRES_PASSWORD: ${VEHICLE_DB_PASSWORD}
      PGPASSWORD: ${VEHICLE_DB_REPLICATION_PASSWORD}
      REPLICATION_USER: ${VEHICLE_DB_REPLICATION_USER}
    depends_on:
