      - controller-2
      - controller-3
    volumes:
      - broker-5-data:/var/lib/kafka/data
    networks:
      - logistic_net

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Logistic-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:19092,broker-2:19092,broker-3:19092,broker-4:19092,broker-5:19092"
    depends_on:
      - broker-1
      - broker-2
      - broker-3
      - broker-4
      - broker-5
    networks:
      - logistic_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      # Tắt TLS nội bộ (chỉ dùng basic auth) để khớp với client wallet_service đang
      # dùng địa chỉ http://, và để dev/local không phải tự dựng CA certificate.
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - logistic_net

  # Container chạy 1 lần rồi thoát: chờ Elasticsearch khỏe, tự động gán mật khẩu
  # KIBANA_PASSWORD cho user hệ thống có sẵn "kibana_system" thông qua Security API.
  # Nhờ đó không ai phải tay copy mật khẩu từ log ES sang cấu hình Kibana.
  es-setup-kibana-user:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: es-setup-kibana-user
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    # LƯU Ý: toàn bộ lệnh phải nằm trên 1 dòng YAML duy nhất. Với block scalar
    # gấp nếp (`>`), dòng nào thụt lề sâu hơn dòng gốc sẽ KHÔNG bị gộp thành
    # khoảng trắng — YAML giữ nguyên xuống dòng thật, khiến bash coi mỗi dòng
    # là 1 lệnh riêng (đây chính là bug gây lỗi "-H: command not found" trước đó).
    command: >
      bash -c "curl -sf -u elastic:$$ELASTIC_PASSWORD -X POST -H 'Content-Type: application/json' http://elasticsearch:9200/_security/user/kibana_system/_password -d '{\"password\":\"'\"$$KIBANA_PASSWORD\"'\"}' && echo '[es-setup-kibana-user] kibana_system password configured'"
    networks:
      - logistic_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    depends_on:
      es-setup-kibana-user:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"
    networks:
      - logistic_net

  auth-db-master:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-master
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-do-db=${AUTH_SERVICE_DB_NAME}
      - --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
    volumes:
      - auth-db-master-data:/var/lib/mysql
      - ./scripts/auth_service/db/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
    networks:
      - logistic_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  auth-db-slave:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-slave
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-do-db=${AUTH_SERVICE_DB_NAME}
      - --bind-address=0.0.0.0
      - --read-only=1
      - --relay-log=auth-db-slave-relay-bin
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
      MASTER_HOST: auth-db-master
    depends_on:
      - auth-db-master
    volumes:
      - auth-db-slave-data:/var/lib/mysql
      - ./scripts/auth_service/db/start-replica.sh:/docker-entrypoint-initdb.d/start-replica.sh
    networks:
      - logistic_net

  user-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: user-db-master
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
      REPLICATION_USER: ${USER_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${USER_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - user-db-master-data:/var/lib/postgresql/data
      - ./config/user_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./scripts/user_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  user-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: user-db-slave
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      PGPASSWORD: ${USER_DB_REPLICATION_PASSWORD}
      REPLICATION_USER: ${USER_DB_REPLICATION_USER}
    depends_on:
      - user-db-master
    volumes:
      - user-db-slave-data:/var/lib/postgresql/data
      - ./scripts/user_service/db/start-replica.sh:/scripts/user_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/user_service/db/start-replica.sh"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  vehicle-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: vehicle-db-master
    ports:
      - "5436:5432"
    environment:
