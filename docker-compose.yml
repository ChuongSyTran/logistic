    volumes:
      - vehicle-db-slave-data:/var/lib/postgresql/data
      - ./scripts/vehicle_service/db/start-replica.sh:/scripts/vehicle_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/vehicle_service/db/start-replica.sh"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${VEHICLE_DB_USER} -d ${VEHICLE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistic_net

  # ==========================================================================
  # WALLET SERVICE — sổ cái ví, giữ/giải phóng cọc, đối soát
  # ==========================================================================
  # Một node MySQL, chưa master/slave: bảng wallets/transactions hiện ghi nhiều
  # đọc ít, và mọi truy vấn đọc đều nằm trong cùng transaction với lệnh ghi
  # (SELECT ... FOR UPDATE), nên tách replica lúc này chỉ thêm độ trễ.
  wallet-db:
    image: docker.io/library/mysql:8.0
    container_name: wallet-db
    command:
      - --bind-address=0.0.0.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${WALLET_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WALLET_SERVICE_DB_NAME}
      MYSQL_USER: ${WALLET_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${WALLET_SERVICE_DB_PASSWORD}
    volumes:
      - wallet-db-data:/var/lib/mysql
    networks:
      - logistic_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  wallet-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: wallet_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    image: ghcr.io/transenpai/logistic/wallet-service:${IMAGE_TAG:-latest}
    container_name: wallet-service
    env_file:
      - .env
    depends_on:
      wallet-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - logistic_net

  # ==========================================================================
  # KYC SERVICE — duyệt hồ sơ tài xế, căn cước, bằng lái
  # ==========================================================================
  kyc-db:
    image: docker.io/library/postgres:16-alpine
    container_name: kyc-db
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: ${KYC_DB_USER}
      POSTGRES_PASSWORD: ${KYC_DB_PASSWORD}
      POSTGRES_DB: ${KYC_DB_NAME}
    volumes:
      - kyc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${KYC_DB_USER} -d ${KYC_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistic_net

  kyc-service:
    build:
      context: .
      dockerfile: kyc_service/Dockerfile
    image: ghcr.io/transenpai/logistic/kyc-service:${IMAGE_TAG:-latest}
    container_name: kyc-service
    env_file:
      - .env
    depends_on:
      kyc-db:
        condition: service_healthy
    volumes:
      - kyc-data:/app/data
    networks:
      - logistic_net

