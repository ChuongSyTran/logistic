  nats-data:
  redis-data:
  rabbitmq-data:
  notification-data:
  notification-db-data:
  gateway-data:
  auth-data:
  media-data:
  matching-data:
  user-data:
  vehicle-data:
  matching-db-master-data:
  postgres-replica-data:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  es-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  broker-4-data:
  broker-5-data:
  auth-db-master-data:
  auth-db-slave-data:
  user-db-master-data:
  user-db-slave-data:
  vehicle-db-master-data:
  vehicle-db-slave-data:
  wallet-db-data:
  kyc-data:
  kyc-db-data:
