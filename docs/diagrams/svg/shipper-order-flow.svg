<svg xmlns="http://www.w3.org/2000/svg" width="1864" height="1830" viewBox="0 0 1864 1830" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1864" height="1830" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng đặt đơn tới khi chốt xe</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Vòng thương lượng: bid → offer → accept hoặc reject. Cọc được kiểm trước, đóng băng sau.</text><rect x="66" y="892" width="1732" height="868" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 892 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="906" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="906" font-size="11" fill="#455A64">[chủ hàng từ chối giá]</text><line x1="66" y1="1144" x2="1798" y2="1144" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1158" font-size="11" fill="#455A64">[chủ hàng chốt xe]</text><rect x="66" y="1342" width="1732" height="418" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1342 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1356" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1356" font-size="11" fill="#455A64">[số dư không đủ]</text><line x1="66" y1="1404" x2="1798" y2="1404" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1418" font-size="11" fill="#455A64">[đủ tiền cọc]</text><line x1="132" y1="128" x2="132" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1332" y1="128" x2="1332" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1532" y1="128" x2="1532" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1732" y1="128" x2="1732" y2="1806" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="726" y="1272" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="541" y="1220" width="12" height="156" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="1572" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="331" y="444" width="12" height="1312" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="336" y="926" width="12" height="830" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="341" y="1168" width="12" height="588" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="236" width="12" height="1520" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="531" y="496" width="12" height="1260" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="536" y="978" width="12" height="778" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /matching/bids</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. SubmitBid</text><line x1="538" y1="288" x2="1326" y2="288" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="932" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. matching.driver.candidates_found</text><line x1="1338" y1="340" x2="1526" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="333" font-size="11.5" fill="#263238" text-anchor="middle">4. giao message</text><line x1="1538" y1="392" x2="1726" y2="392" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1632" y="385" font-size="11.5" fill="#263238" text-anchor="middle">5. push &quot;có đơn gần bạn&quot;</text><line x1="1726" y1="444" x2="338" y2="444" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1032" y="437" font-size="11.5" fill="#263238" text-anchor="middle">6. POST /matching/offers (giá 3.2tr)</text><line x1="338" y1="496" x2="526" y2="496" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="489" font-size="11.5" fill="#263238" text-anchor="middle">7. SubmitOffer</text><line x1="538" y1="548" x2="926" y2="548" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="541" font-size="11.5" fill="#263238" text-anchor="middle">8. publish matching.offers.{bid_id}</text><line x1="926" y1="600" x2="538" y2="600" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="593" font-size="11.5" fill="#263238" text-anchor="middle">9. consumer → ProcessOfferQueue</text><text x="732" y="615" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">hàng đợi để nhiều báo giá cùng đơn xử lý tuần tự</text><polyline points="538,668 584,668 584,694 544,694" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="674" font-size="11.5" fill="#263238">10. bid.status = NEGOTIATING</text><text x="594" y="689" font-size="10.5" font-style="italic" fill="#78909C">khoá mềm: tài xế khác bị từ chối ngay</text><line x1="538" y1="770" x2="1326" y2="770" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="932" y="763" font-size="11.5" fill="#263238" text-anchor="middle">11. matching.offer.received</text><line x1="1338" y1="822" x2="1526" y2="822" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="815" font-size="11.5" fill="#263238" text-anchor="middle">12. giao message</text><line x1="1526" y1="874" x2="138" y2="874" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="867" font-size="11.5" fill="#263238" text-anchor="middle">13. push &quot;có báo giá mới&quot;</text><line x1="138" y1="926" x2="326" y2="926" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="919" font-size="11.5" fill="#263238" text-anchor="middle">14. POST /matching/offers/reject</text><line x1="338" y1="978" x2="526" y2="978" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="971" font-size="11.5" fill="#263238" text-anchor="middle">15. RejectOffer</text><polyline points="538,1030 584,1030 584,1056 544,1056" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="1036" font-size="11.5" fill="#263238">16. bid.status = PENDING (mở lại)</text><line x1="538" y1="1116" x2="1326" y2="1116" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="932" y="1109" font-size="11.5" fill="#263238" text-anchor="middle">17. matching.offer.rejected</text><line x1="138" y1="1168" x2="326" y2="1168" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1161" font-size="11.5" fill="#263238" text-anchor="middle">18. POST /matching/matches/accept</text><line x1="338" y1="1220" x2="526" y2="1220" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="1213" font-size="11.5" fill="#263238" text-anchor="middle">19. AcceptMatch</text><line x1="538" y1="1272" x2="726" y2="1272" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="1265" font-size="11.5" fill="#263238" text-anchor="middle">20. CheckBalance(shipper_id)</text><line x1="726" y1="1324" x2="538" y2="1324" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="1317" font-size="11.5" fill="#263238" text-anchor="middle">21. balance</text><line x1="526" y1="1376" x2="138" y2="1376" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="332" y="1369" font-size="11.5" fill="#263238" text-anchor="middle">22. 422 INSUFFICIENT_BALANCE</text><line x1="538" y1="1428" x2="1126" y2="1428" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="1421" font-size="11.5" fill="#263238" text-anchor="middle">23. wallet.hold_deposit (đóng băng cọc 10%)</text><polyline points="538,1480 584,1480 584,1506 544,1506" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="1486" font-size="11.5" fill="#263238">24. INSERT matches → bid/ask = MATCHED</text><text x="594" y="1501" font-size="10.5" font-style="italic" fill="#78909C">ghi hợp đồng trước, lật trạng thái sau</text><line x1="538" y1="1582" x2="1326" y2="1582" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="932" y="1575" font-size="11.5" fill="#263238" text-anchor="middle">25. matching.match.found</text><line x1="1338" y1="1634" x2="1526" y2="1634" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="1627" font-size="11.5" fill="#263238" text-anchor="middle">26. giao message</text><line x1="1526" y1="1686" x2="138" y2="1686" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="1679" font-size="11.5" fill="#263238" text-anchor="middle">27. push &quot;đã tìm được xe&quot;</text><line x1="1538" y1="1738" x2="1726" y2="1738" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1632" y="1731" font-size="11.5" fill="#263238" text-anchor="middle">28. push &quot;bạn nhận được đơn&quot;</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Chủ hàng</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">matching_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">wallet_service</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">NATS JetStream</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">Kafka</text><rect x="1248" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="1332" y="106" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">RabbitMQ</text><rect x="1448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">notification_service</text><rect x="1648" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="1732" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text></svg>