<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1446" viewBox="0 0 1464 1446" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1464" height="1446" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng GPS và tìm xe đang chạy</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Phần trên: tài xế ping GPS. Phần dưới: matching hỏi xe quanh điểm lấy hàng.</text><rect x="66" y="510" width="1132" height="384" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 510 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="524" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="524" font-size="11" fill="#455A64">[toạ độ không hợp lệ]</text><line x1="66" y1="572" x2="1198" y2="572" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="586" font-size="11" fill="#455A64">[toạ độ hợp lệ]</text><rect x="666" y="942" width="532" height="366" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 666 942 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="674" y="956" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="732" y="956" font-size="11" fill="#455A64">[Redis khả dụng]</text><line x1="666" y1="1262" x2="1198" y2="1262" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="674" y="1276" font-size="11" fill="#455A64">[Redis lỗi — fallback]</text><line x1="132" y1="128" x2="132" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1332" y1="128" x2="1332" y2="1422" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="726" y="406" width="12" height="138" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="936" y="700" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1126" y="976" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="924" width="12" height="430" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="926" y="596" width="12" height="776" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="931" y="648" width="12" height="724" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="936" y="1080" width="12" height="292" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="941" y="1148" width="12" height="224" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="946" y="1286" width="12" height="86" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="1188" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="354" width="12" height="1018" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /vehicles/{id}/location</text><text x="232" y="199" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">vài giây một lần, mỗi xe</text><polyline points="338,252 384,252 384,278 344,278" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="258" font-size="11.5" fill="#263238">2. limit_req gps_zone 60r/s</text><text x="394" y="273" font-size="10.5" font-style="italic" fill="#78909C">ngưỡng riêng, cao gấp đôi API thường</text><line x1="338" y1="354" x2="526" y2="354" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="347" font-size="11.5" fill="#263238" text-anchor="middle">3. proxy_pass</text><line x1="538" y1="406" x2="726" y2="406" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="399" font-size="11.5" fill="#263238" text-anchor="middle">4. ReportLocation</text><polyline points="738,458 784,458 784,484 744,484" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="794" y="464" font-size="11.5" fill="#263238">5. IsValidCoordinate + ComputeZoneID</text><line x1="726" y1="544" x2="138" y2="544" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="537" font-size="11.5" fill="#263238" text-anchor="middle">6. 400 INVALID_COORDINATE</text><line x1="738" y1="596" x2="926" y2="596" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="589" font-size="11.5" fill="#263238" text-anchor="middle">7. UPSERT vehicle_locations (ghi đè 1 dòng)</text><line x1="738" y1="648" x2="926" y2="648" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="641" font-size="11.5" fill="#263238" text-anchor="middle">8. UPDATE driver_availabilities (toạ độ, zone)</text><line x1="738" y1="700" x2="926" y2="700" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="693" font-size="11.5" fill="#263238" text-anchor="middle">9. SELECT is_online</text><line x1="926" y1="752" x2="738" y2="752" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="832" y="745" font-size="11.5" fill="#263238" text-anchor="middle">10. is_online</text><line x1="738" y1="804" x2="1126" y2="804" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="932" y="797" font-size="11.5" fill="#263238" text-anchor="middle">11. GEOADD geo:online</text><text x="932" y="819" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">chỉ khi tài xế đang bật nhận đơn</text><line x1="726" y1="872" x2="138" y2="872" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="865" font-size="11.5" fill="#263238" text-anchor="middle">12. 200 { zone_id }</text><line x1="1326" y1="924" x2="738" y2="924" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1032" y="917" font-size="11.5" fill="#263238" text-anchor="middle">13. SearchNearbyVehicles (gRPC)</text><line x1="738" y1="976" x2="1126" y2="976" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="932" y="969" font-size="11.5" fill="#263238" text-anchor="middle">14. GEOSEARCH bán kính, limit×3</text><line x1="1126" y1="1028" x2="738" y2="1028" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="932" y="1021" font-size="11.5" fill="#263238" text-anchor="middle">15. [(vehicle_id, khoảng cách)] gần→xa</text><line x1="738" y1="1080" x2="926" y2="1080" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="1073" font-size="11.5" fill="#263238" text-anchor="middle">16. SELECT vehicles WHERE id IN (...)</text><text x="832" y="1095" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">gộp 1 câu, tránh N+1</text><line x1="738" y1="1148" x2="926" y2="1148" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="1141" font-size="11.5" fill="#263238" text-anchor="middle">17. SELECT availabilities WHERE vehicle_id IN (...)</text><polyline points="738,1200 784,1200 784,1226 744,1226" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="794" y="1206" font-size="11.5" fill="#263238">18. lọc: verified · active · đúng loại · đủ tải</text><line x1="738" y1="1286" x2="926" y2="1286" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="1279" font-size="11.5" fill="#263238" text-anchor="middle">19. quét zone lân cận + haversine trong Go</text><text x="832" y="1301" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">đường dự phòng, chậm hơn</text><line x1="738" y1="1354" x2="1326" y2="1354" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="1032" y="1347" font-size="11.5" fill="#263238" text-anchor="middle">20. []NearbyVehicle</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">App tài xế</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#FFEBEE" stroke="#E53935" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#B71C1C" text-anchor="middle">Nginx</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">vehicle_service</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Postgres</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Redis GEO</text><rect x="1248" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1332" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">matching_service</text></svg>