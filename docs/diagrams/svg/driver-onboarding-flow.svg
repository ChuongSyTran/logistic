<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="1694" viewBox="0 0 1264 1694" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1264" height="1694" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng tài xế gia nhập hệ thống</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Năm bước, hai lần admin duyệt. Xe chỉ vào chỉ mục tìm kiếm ở bước cuối.</text><rect x="466" y="858" width="532" height="108" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 466 858 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="474" y="872" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="532" y="872" font-size="11" fill="#455A64">[hồ sơ đã duyệt trước đó]</text><line x1="466" y1="920" x2="998" y2="920" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="474" y="934" font-size="11" fill="#455A64">[còn pending]</text><rect x="66" y="1464" width="1132" height="160" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1464 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1478" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1478" font-size="11" fill="#455A64">[đạt cả 4 điều kiện]</text><line x1="66" y1="1578" x2="1198" y2="1578" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1592" font-size="11" fill="#455A64">[không đạt]</text><line x1="132" y1="128" x2="132" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="526" y="236" width="12" height="154" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="258" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="546" width="12" height="138" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="840" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="1048" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="731" y="1360" width="12" height="190" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="1256" width="12" height="346" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1126" y="1498" width="12" height="122" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="494" width="12" height="1126" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="331" y="736" width="12" height="884" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="336" y="788" width="12" height="832" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="341" y="996" width="12" height="624" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="346" y="1152" width="12" height="468" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="351" y="1204" width="12" height="416" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="356" y="1308" width="12" height="312" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /auth/register (role=driver)</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. RegisterUser(id = id danh tính)</text><polyline points="538,288 584,288 584,314 544,314" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="294" font-size="11.5" fill="#263238">3. tạo users + driver_profiles RỖNG</text><text x="594" y="309" font-size="10.5" font-style="italic" fill="#78909C">license/id_card = NULL, không phải &quot;&quot;</text><line x1="526" y1="390" x2="338" y2="390" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="383" font-size="11.5" fill="#263238" text-anchor="middle">4. user_id</text><line x1="326" y1="442" x2="138" y2="442" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="435" font-size="11.5" fill="#263238" text-anchor="middle">5. 201 Created</text><line x1="138" y1="494" x2="326" y2="494" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="487" font-size="11.5" fill="#263238" text-anchor="middle">6. PUT /users/{id}/driver-profile</text><line x1="338" y1="546" x2="526" y2="546" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="539" font-size="11.5" fill="#263238" text-anchor="middle">7. UpdateDriverProfile</text><polyline points="538,598 584,598 584,624 544,624" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="604" font-size="11.5" fill="#263238">8. mustBeRole(driver)</text><line x1="526" y1="684" x2="338" y2="684" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="677" font-size="11.5" fill="#263238" text-anchor="middle">9. kyc_status = pending</text><line x1="926" y1="736" x2="338" y2="736" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="729" font-size="11.5" fill="#263238" text-anchor="middle">10. GET /admin/kyc/pending</text><line x1="926" y1="788" x2="338" y2="788" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="781" font-size="11.5" fill="#263238" text-anchor="middle">11. PUT /admin/kyc/{id}/review</text><line x1="338" y1="840" x2="526" y2="840" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="833" font-size="11.5" fill="#263238" text-anchor="middle">12. AdminReviewKYC</text><line x1="538" y1="892" x2="926" y2="892" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="732" y="885" font-size="11.5" fill="#263238" text-anchor="middle">13. 422 KYC_ALREADY_REVIEWED</text><line x1="538" y1="944" x2="926" y2="944" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="732" y="937" font-size="11.5" fill="#263238" text-anchor="middle">14. kyc_status = approved</text><line x1="138" y1="996" x2="326" y2="996" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="989" font-size="11.5" fill="#263238" text-anchor="middle">15. POST /vehicles</text><line x1="338" y1="1048" x2="726" y2="1048" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="1041" font-size="11.5" fill="#263238" text-anchor="middle">16. RegisterVehicle</text><line x1="726" y1="1100" x2="138" y2="1100" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="1093" font-size="11.5" fill="#263238" text-anchor="middle">17. verification_status = pending</text><line x1="138" y1="1152" x2="326" y2="1152" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1145" font-size="11.5" fill="#263238" text-anchor="middle">18. POST /vehicles/{id}/documents</text><line x1="926" y1="1204" x2="338" y2="1204" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="1197" font-size="11.5" fill="#263238" text-anchor="middle">19. PUT /admin/vehicles/{id}/verify</text><line x1="338" y1="1256" x2="726" y2="1256" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="1249" font-size="11.5" fill="#263238" text-anchor="middle">20. AdminVerifyVehicle → verified</text><line x1="138" y1="1308" x2="326" y2="1308" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1301" font-size="11.5" fill="#263238" text-anchor="middle">21. POST /drivers/{id}/availability</text><line x1="338" y1="1360" x2="726" y2="1360" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="1353" font-size="11.5" fill="#263238" text-anchor="middle">22. SetDriverAvailability(is_online=true)</text><polyline points="738,1412 784,1412 784,1438 744,1438" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="794" y="1418" font-size="11.5" fill="#263238">23. kiểm: đúng chủ · đã duyệt · không bảo dưỡng · toạ độ hợp lệ</text><line x1="738" y1="1498" x2="1126" y2="1498" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="932" y="1491" font-size="11.5" fill="#263238" text-anchor="middle">24. GEOADD geo:online &lt;vehicle_id&gt;</text><line x1="726" y1="1550" x2="138" y2="1550" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="1543" font-size="11.5" fill="#263238" text-anchor="middle">25. 200 — sẵn sàng nhận đơn</text><line x1="726" y1="1602" x2="138" y2="1602" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="1595" font-size="11.5" fill="#263238" text-anchor="middle">26. 422 VEHICLE_NOT_VERIFIED</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">user_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">vehicle_service</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Admin</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Redis GEO</text></svg>