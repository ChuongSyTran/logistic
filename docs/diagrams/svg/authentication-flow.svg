<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="1744" viewBox="0 0 1264 1744" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1264" height="1744" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng xác thực và phân quyền</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Hai đường đăng nhập, rồi tới bước kiểm quyền khi gọi endpoint quản trị.</text><rect x="66" y="374" width="932" height="920" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 374 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="388" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="388" font-size="11" fill="#455A64">[đăng nhập bằng email + mật khẩu]</text><line x1="66" y1="592" x2="998" y2="592" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="606" font-size="11" fill="#455A64">[đăng nhập bằng Google OAuth2]</text><rect x="66" y="1030" width="932" height="264" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1030 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1044" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1044" font-size="11" fill="#455A64">[state lệch hoặc thiếu cookie]</text><line x1="66" y1="1092" x2="998" y2="1092" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1106" font-size="11" fill="#455A64">[state khớp]</text><rect x="66" y="1514" width="1132" height="160" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1514 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1528" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1528" font-size="11" fill="#455A64">[role ≠ admin]</text><line x1="66" y1="1576" x2="1198" y2="1576" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1590" font-size="11" fill="#455A64">[role = admin]</text><line x1="132" y1="128" x2="132" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1720" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="326" y="184" width="12" height="172" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="531" y="460" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="408" width="12" height="156" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="616" width="12" height="190" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="910" width="12" height="154" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="536" y="1116" width="12" height="104" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="1324" width="12" height="224" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1126" y="1600" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="236" width="12" height="1434" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="531" y="668" width="12" height="1002" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="288" width="12" height="1382" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="926" y="858" width="12" height="812" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="931" y="1168" width="12" height="502" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /auth/register</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. Register → id danh tính</text><line x1="338" y1="288" x2="726" y2="288" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. RegisterUser(id = id danh tính)</text><text x="532" y="303" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">cùng id thì token và hồ sơ trỏ về một người</text><line x1="326" y1="356" x2="138" y2="356" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="349" font-size="11.5" fill="#263238" text-anchor="middle">4. 201 Created</text><line x1="138" y1="408" x2="326" y2="408" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="401" font-size="11.5" fill="#263238" text-anchor="middle">5. POST /auth/login</text><line x1="338" y1="460" x2="526" y2="460" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="453" font-size="11.5" fill="#263238" text-anchor="middle">6. Login(email, password)</text><line x1="526" y1="512" x2="338" y2="512" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="505" font-size="11.5" fill="#263238" text-anchor="middle">7. TokenPair · hoặc Unauthenticated</text><line x1="326" y1="564" x2="138" y2="564" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="557" font-size="11.5" fill="#263238" text-anchor="middle">8. 200 { access_token } · hoặc 401</text><line x1="138" y1="616" x2="326" y2="616" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="609" font-size="11.5" fill="#263238" text-anchor="middle">9. GET /auth/google/login</text><line x1="338" y1="668" x2="526" y2="668" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="661" font-size="11.5" fill="#263238" text-anchor="middle">10. GetGoogleLoginURL(state)</text><polyline points="338,720 384,720 384,746 344,746" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="726" font-size="11.5" fill="#263238">11. Set-Cookie oauth_state (HttpOnly, 5 phút)</text><line x1="326" y1="806" x2="138" y2="806" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="799" font-size="11.5" fill="#263238" text-anchor="middle">12. 307 → accounts.google.com</text><line x1="138" y1="858" x2="926" y2="858" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="851" font-size="11.5" fill="#263238" text-anchor="middle">13. đăng nhập + đồng ý</text><line x1="926" y1="910" x2="338" y2="910" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="903" font-size="11.5" fill="#263238" text-anchor="middle">14. GET /callback?code=…&amp;state=…</text><polyline points="338,962 384,962 384,988 344,988" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="968" font-size="11.5" fill="#263238">15. so state trên URL ↔ cookie</text><text x="394" y="983" font-size="10.5" font-style="italic" fill="#78909C">cookie chỉ có trên máy người khởi tạo</text><line x1="326" y1="1064" x2="138" y2="1064" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1057" font-size="11.5" fill="#263238" text-anchor="middle">16. 400 INVALID_OAUTH_STATE</text><line x1="338" y1="1116" x2="526" y2="1116" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="1109" font-size="11.5" fill="#263238" text-anchor="middle">17. GoogleCallback(code)</text><line x1="538" y1="1168" x2="926" y2="1168" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="732" y="1161" font-size="11.5" fill="#263238" text-anchor="middle">18. đổi code lấy token (client_secret)</text><line x1="526" y1="1220" x2="338" y2="1220" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="1213" font-size="11.5" fill="#263238" text-anchor="middle">19. TokenPair</text><line x1="326" y1="1272" x2="138" y2="1272" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1265" font-size="11.5" fill="#263238" text-anchor="middle">20. Set-Cookie + 307 về frontend</text><line x1="138" y1="1324" x2="326" y2="1324" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1317" font-size="11.5" fill="#263238" text-anchor="middle">21. GET /api/v1/admin/users  (Bearer)</text><polyline points="338,1376 384,1376 384,1402 344,1402" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="1382" font-size="11.5" fill="#263238">22. IdentityContext: đọc X-User-Id / X-User-Role</text><polyline points="338,1462 384,1462 384,1488 344,1488" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="1468" font-size="11.5" fill="#263238">23. RequireRole(&quot;admin&quot;) — gắn ở CẤP GROUP</text><line x1="326" y1="1548" x2="138" y2="1548" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1541" font-size="11.5" fill="#263238" text-anchor="middle">24. 403 PERMISSION_DENIED</text><line x1="338" y1="1600" x2="1126" y2="1600" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="732" y="1593" font-size="11.5" fill="#263238" text-anchor="middle">25. AdminListUsers (gRPC)</text><line x1="1126" y1="1652" x2="138" y2="1652" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="1645" font-size="11.5" fill="#263238" text-anchor="middle">26. 200 { users, pagination }</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Người dùng</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">auth_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">user_service</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#ECEFF1" stroke="#78909C" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#37474F" text-anchor="middle">Google OAuth2</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">service nội bộ</text></svg>