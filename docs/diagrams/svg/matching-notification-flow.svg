<svg xmlns="http://www.w3.org/2000/svg" width="1864" height="1262" viewBox="0 0 1864 1262" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1864" height="1262" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng ghép xe và thông báo</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Chủ hàng nhận phản hồi ngay ở bước 9; phần thông báo chạy bất đồng bộ sau đó.</text><rect x="866" y="876" width="932" height="316" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 866 876 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="874" y="890" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="932" y="890" font-size="11" fill="#455A64">[event_id chưa có trong processed_events]</text><line x1="866" y1="1146" x2="1798" y2="1146" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="874" y="1160" font-size="11" fill="#455A64">[event_id đã xử lý — broker giao lại]</text><line x1="132" y1="128" x2="132" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1332" y1="128" x2="1332" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1532" y1="128" x2="1532" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1732" y1="128" x2="1732" y2="1238" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="726" y="288" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="392" width="12" height="68" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="236" width="12" height="328" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="432" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1326" y="720" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1326" y="910" width="12" height="278" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1331" y="962" width="12" height="226" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /api/v1/matching/bids</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. SubmitBid (gRPC)</text><line x1="538" y1="288" x2="726" y2="288" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. INSERT bids (PENDING)</text><line x1="726" y1="340" x2="538" y2="340" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="333" font-size="11.5" fill="#263238" text-anchor="middle">4. bid_id</text><line x1="538" y1="392" x2="726" y2="392" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="385" font-size="11.5" fill="#263238" text-anchor="middle">5. FindAskForBid</text><text x="632" y="407" font-size="10.5" font-style="italic" fill="#78909C" text-anchor="middle">cùng zone · đủ tải · giá ≤ max_price</text><line x1="726" y1="460" x2="538" y2="460" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="453" font-size="11.5" fill="#263238" text-anchor="middle">6. []Ask (ứng viên)</text><line x1="538" y1="512" x2="926" y2="512" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="505" font-size="11.5" fill="#263238" text-anchor="middle">7. publish matching.driver.candidates_found</text><line x1="526" y1="564" x2="338" y2="564" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="557" font-size="11.5" fill="#263238" text-anchor="middle">8. bid_id, status</text><line x1="326" y1="616" x2="138" y2="616" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="609" font-size="11.5" fill="#263238" text-anchor="middle">9. 200 { bid_id }</text><line x1="938" y1="668" x2="1126" y2="668" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1032" y="661" font-size="11.5" fill="#263238" text-anchor="middle">10. giao message (prefetch 20)</text><line x1="1138" y1="720" x2="1326" y2="720" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1232" y="713" font-size="11.5" fill="#263238" text-anchor="middle">11. GetOrCreatePreference (mỗi tài xế)</text><line x1="1326" y1="772" x2="1138" y2="772" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="1232" y="765" font-size="11.5" fill="#263238" text-anchor="middle">12. NotificationPreference</text><polyline points="1138,824 1184,824 1184,850 1144,850" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1194" y="830" font-size="11.5" fill="#263238">13. lọc theo cài đặt + giờ yên lặng</text><line x1="1138" y1="910" x2="1326" y2="910" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1232" y="903" font-size="11.5" fill="#263238" text-anchor="middle">14. BEGIN · INSERT processed_events</text><line x1="1138" y1="962" x2="1326" y2="962" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1232" y="955" font-size="11.5" fill="#263238" text-anchor="middle">15. INSERT notifications (bulk) · COMMIT</text><line x1="1138" y1="1014" x2="1526" y2="1014" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1332" y="1007" font-size="11.5" fill="#263238" text-anchor="middle">16. DEL unread:&lt;user_id&gt;</text><line x1="1126" y1="1066" x2="938" y2="1066" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1032" y="1059" font-size="11.5" fill="#263238" text-anchor="middle">17. ACK</text><line x1="1138" y1="1118" x2="1726" y2="1118" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="1111" font-size="11.5" fill="#263238" text-anchor="middle">18. push &quot;có đơn hàng phù hợp gần bạn&quot;</text><line x1="1126" y1="1170" x2="938" y2="1170" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1032" y="1163" font-size="11.5" fill="#263238" text-anchor="middle">19. ACK (bỏ qua, không tạo gì)</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Chủ hàng</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">matching_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="732" y="98" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Postgres</text><text x="732" y="113" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">(matching)</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="932" y="98" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">RabbitMQ</text><text x="932" y="113" font-size="12.0" font-weight="400" fill="#4A148C" text-anchor="middle">logistic.events</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">notification_service</text><rect x="1248" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="1332" y="98" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Postgres</text><text x="1332" y="113" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">(notification)</text><rect x="1448" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="1532" y="98" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Redis</text><text x="1532" y="113" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">bộ đếm chưa đọc</text><rect x="1648" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="1732" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text></svg>