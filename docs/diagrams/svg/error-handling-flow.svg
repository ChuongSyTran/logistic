<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1174" viewBox="0 0 1664 1174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1664" height="1174" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng lỗi xuyên tầng</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Ví dụ: đăng ký trùng số điện thoại. Bốn lần biến đổi, chi tiết SQL dừng lại ở log.</text><line x1="132" y1="128" x2="132" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1332" y1="128" x2="1332" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1532" y1="128" x2="1532" y2="1150" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="1326" y="444" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="1126" y="392" width="12" height="258" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="926" y="340" width="12" height="362" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="288" width="12" height="466" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="236" width="12" height="708" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="898" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /users/register (phone đã tồn tại)</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. RegisterUser (gRPC)</text><line x1="538" y1="288" x2="726" y2="288" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. chuyển tiếp</text><line x1="738" y1="340" x2="926" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="832" y="333" font-size="11.5" fill="#263238" text-anchor="middle">4. RegisterUser(param)</text><line x1="938" y1="392" x2="1126" y2="392" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1032" y="385" font-size="11.5" fill="#263238" text-anchor="middle">5. CreateUser(entity)</text><line x1="1138" y1="444" x2="1326" y2="444" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1232" y="437" font-size="11.5" fill="#263238" text-anchor="middle">6. INSERT INTO users</text><line x1="1326" y1="496" x2="1138" y2="496" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="1232" y="489" font-size="11.5" fill="#263238" text-anchor="middle">7. duplicate key: users_phone_key</text><polyline points="1138,548 1184,548 1184,574 1144,574" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="1194" y="554" font-size="11.5" fill="#263238">8. wrapError → apperr{AlreadyExists, PHONE_ALREADY_USED}</text><text x="1194" y="569" font-size="10.5" font-style="italic" fill="#78909C">đọc tên index để biết CỘT nào trùng</text><line x1="1126" y1="650" x2="938" y2="650" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="1032" y="643" font-size="11.5" fill="#263238" text-anchor="middle">9. *apperr.Error</text><line x1="926" y1="702" x2="738" y2="702" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="832" y="695" font-size="11.5" fill="#263238" text-anchor="middle">10. return err — KHÔNG bọc thêm</text><line x1="726" y1="754" x2="538" y2="754" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="747" font-size="11.5" fill="#263238" text-anchor="middle">11. return err — KHÔNG có status.Errorf</text><polyline points="538,806 584,806 584,832 544,832" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="812" font-size="11.5" fill="#263238">12. status.New(code) + ErrorInfo{Reason}</text><line x1="538" y1="892" x2="1526" y2="892" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1032" y="885" font-size="11.5" fill="#263238" text-anchor="middle">13. câu SQL, tên bảng dừng lại ở đây</text><line x1="526" y1="944" x2="338" y2="944" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="937" font-size="11.5" fill="#263238" text-anchor="middle">14. gRPC ALREADY_EXISTS + ErrorInfo</text><polyline points="338,996 384,996 384,1022 344,1022" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="1002" font-size="11.5" fill="#263238">15. response.Error → HTTP 409</text><line x1="326" y1="1082" x2="138" y2="1082" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1075" font-size="11.5" fill="#263238" text-anchor="middle">16. 409 { code: PHONE_ALREADY_USED, request_id }</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Client</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="532" y="98" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">ErrorInterceptor</text><text x="532" y="113" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">(pkg/middleware)</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">controller</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">biz</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">repo</text><rect x="1248" y="76" width="168" height="52" rx="7" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="1332" y="106" font-size="12.8" font-weight="600" fill="#E65100" text-anchor="middle">Postgres</text><rect x="1448" y="76" width="168" height="52" rx="7" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="1532" y="106" font-size="12.8" font-weight="600" fill="#795548" text-anchor="middle">Log nội bộ</text></svg>