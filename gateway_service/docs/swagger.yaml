basePath: /
definitions:
  gateway_service_internal_response.Envelope:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
    type: object
  gateway_service_internal_response.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/gateway_service_internal_response.ErrorDetail'
      request_id:
        type: string
    type: object
  gateway_service_internal_response.ErrorDetail:
    properties:
      code:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  internal_controller.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_controller.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_controller.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        enum:
        - driver
        - shipper
        type: string
    required:
    - email
    - password
    type: object
  internal_controller.RegisterUserReq:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        enum:
        - driver
        - shipper
        type: string
    required:
    - password
    - phone
    - role
    type: object
  internal_controller.ReviewKYCReq:
    properties:
      approved:
        type: boolean
      note:
        type: string
    type: object
  internal_controller.SubmitKYCReq:
    properties:
      id_card_back_url:
        type: string
      id_card_front_url:
        type: string
      id_card_number:
        type: string
      license_back_url:
        type: string
      license_front_url:
        type: string
      license_number:
        type: string
      note:
        type: string
      status:
        enum:
        - pending
        - approved
        - rejected
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API Gateway trung tâm cho hệ thống Logistics OS. Nhận toàn bộ HTTP request từ client và phân luồng tới các microservice nội bộ qua gRPC.

    **Các service được proxy:**
    - **Auth** (`/api/v1/auth/*`) — Đăng ký, đăng nhập, OAuth2 Google, xác thực token
    - **User** (`/api/v1/users/*`) — Quản lý người dùng, hồ sơ tài xế/chủ hàng, KYC
    - **Vehicle** (`/api/v1/vehicles/*`) — Đăng ký & quản lý phương tiện, báo GPS, tìm xe gần
    - **Matching** (`/api/v1/matching/*`) — Ghép đơn theo mô hình Bid/Ask
    - **Notification** (`/api/v1/notifications/*`) — Hộp thư thông báo
    - **Media** (`/api/v1/media/*`) — Tải file lên Cloudinary
  title: Logistics OS — Gateway API
  version: "1.0"
paths:
  /api/v1/addresses/{id}:
    delete:
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Xoá địa chỉ
      tags:
      - Address
    put:
      consumes:
      - application/json
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Cập nhật địa chỉ
      tags:
      - Address
  /api/v1/admin/kyc/{user_id}/review:
    put:
      consumes:
      - application/json
      description: Admin phê duyệt hoặc từ chối hồ sơ KYC
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Thông tin duyệt KYC
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.ReviewKYCReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Duyệt/từ chối KYC'
      tags:
      - Admin-KYC
  /api/v1/admin/kyc/count-pending:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Đếm số lượng hồ sơ KYC đang chờ duyệt'
      tags:
      - Admin-KYC
  /api/v1/admin/kyc/pending:
    get:
      description: Danh sách các hồ sơ KYC đang chờ duyệt
      parameters:
      - description: Số trang
        in: query
        name: page
