      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Xoá người dùng'
      tags:
      - Admin-User
  /api/v1/admin/users/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Khoá/mở tài khoản'
      tags:
      - Admin-User
  /api/v1/admin/users/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Thống kê người dùng'
      tags:
      - Admin-User
  /api/v1/admin/vehicle-documents/{id}/review:
    put:
      consumes:
      - application/json
      parameters:
      - description: Document ID
        in: path
        name: id
