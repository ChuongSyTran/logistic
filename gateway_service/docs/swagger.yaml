          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Thống kê phương tiện'
      tags:
      - Admin-Vehicle
  /api/v1/auth/google/callback:
    get:
      description: Xử lý callback từ Google, xác thực state, đổi code lấy token rồi
        set cookie.
      parameters:
      - description: OAuth state parameter (CSRF protection)
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code từ Google
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect về frontend với cookie đã set
          schema:
            type: string
      summary: Google OAuth2 Callback
      tags:
      - Auth - OAuth2
  /api/v1/auth/google/login:
    get:
      description: Khởi tạo luồng OAuth2 với Google. Tạo state cookie để chống CSRF.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect đến Google OAuth consent screen
          schema:
            type: string
      summary: Đăng nhập bằng Google OAuth2
      tags:
      - Auth - OAuth2
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Đăng nhập bằng email và mật khẩu. Trả về access_token, refresh_token
        và expires_at.
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng nhập thành công
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
        "401":
          description: Sai email hoặc mật khẩu
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
      summary: Đăng nhập
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Thu hồi refresh token của phiên hiện tại. Access token đang cầm
        vẫn còn hiệu lực tới khi hết hạn (tối đa 15 phút).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Đăng xuất
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Trả về profile của chủ nhân access token.
      parameters:
      - description: Bearer token (nếu không dùng cookie)
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
      summary: Lấy thông tin người dùng hiện tại
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Đổi refresh token lấy cặp token mới. Refresh token dùng MỘT LẦN
        — mỗi lần gọi trả về refresh token mới, token cũ hết hiệu lực ngay.
      parameters:
      - description: Refresh token (nếu không dùng cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_controller.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
        "401":
          description: Refresh token không hợp lệ
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
        "403":
          description: Phiên đã bị thu hồi, cần đăng nhập lại
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
      summary: Làm mới phiên đăng nhập
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản mới bằng email và mật khẩu. Gateway chuyển tiếp request
        tới auth_service qua gRPC.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tạo tài khoản thành công
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
        "409":
          description: Email đã tồn tại
          schema:
            $ref: '#/definitions/gateway_service_internal_response.ErrorBody'
      summary: Đăng ký tài khoản
      tags:
      - Auth
  /api/v1/devices/{id}:
    delete:
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Xoá thiết bị
      tags:
      - Device
  /api/v1/drivers/{driver_id}/availability:
    get:
      parameters:
      - description: Driver ID
        in: path
        name: driver_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Trạng thái nhận đơn của tài xế
      tags:
      - Vehicle
    post:
      consumes:
      - application/json
      description: Bật thì xe được đưa vào chỉ mục tìm kiếm của matching; tắt thì
        gỡ ra.
      parameters:
      - description: Driver ID
        in: path
        name: driver_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Bật/tắt nhận đơn
      tags:
      - Vehicle
  /api/v1/matching/asks:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Tài xế đăng chuyến còn chỗ trống
      tags:
      - Matching
  /api/v1/matching/bids:
    post:
      consumes:
      - application/json
      description: Sau khi lưu đơn, matching_service tìm tài xế phù hợp và phát sự
        kiện qua RabbitMQ để notification_service báo cho từng tài xế.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Chủ hàng đăng đơn cần xe
      tags:
      - Matching
  /api/v1/matching/matches/accept:
    post:
      consumes:
      - application/json
      description: Chốt xong, matching_service phát matching.match.found; notification_service
        báo cho cả chủ hàng lẫn tài xế.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Chủ hàng chốt xe
      tags:
      - Matching
  /api/v1/matching/offers:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Tài xế báo giá cho một đơn hàng
      tags:
      - Matching
  /api/v1/matching/offers/reject:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Chủ hàng từ chối báo giá
      tags:
      - Matching
  /api/v1/media/files/{publicID}:
    delete:
      description: Xóa file trên hệ thống lưu trữ thông qua public_id.
      parameters:
      - description: Public ID của file cần xóa
        in: path
        name: publicID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Thiếu public_id
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Không tìm thấy file
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Xóa file
      tags:
      - Media
  /api/v1/media/upload:
    post:
      consumes:
      - multipart/form-data
      description: Nhận file qua multipart/form-data và gọi gRPC sang media_service
        để lưu trữ (ví dụ Cloudinary).
      parameters:
      - description: File cần tải lên
        in: formData
        name: file
        required: true
        type: file
      - description: Thư mục lưu trữ
        in: formData
        name: folder
        type: string
      - description: Tiền tố tên file
        in: formData
        name: prefix
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tải lên thành công, trả về URL
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi thiếu file hoặc file không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Tải file lên hệ thống
      tags:
      - Media
  /api/v1/notifications/{id}:
    delete:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Xoá thông báo
      tags:
      - Notification
    get:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Chi tiết một thông báo
      tags:
      - Notification
  /api/v1/notifications/{id}/read:
    put:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: Đánh dấu đã đọc
      tags:
