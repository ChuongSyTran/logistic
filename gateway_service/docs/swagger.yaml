      - description: Kích thước trang
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Hàng đợi duyệt KYC'
      tags:
      - Admin-KYC
  /api/v1/admin/notification-templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Danh sách template'
      tags:
      - Admin-Notification
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Tạo template thông báo'
      tags:
      - Admin-Notification
  /api/v1/admin/notification-templates/{id}:
    delete:
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Xoá template thông báo'
      tags:
      - Admin-Notification
    put:
      consumes:
      - application/json
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Sửa template thông báo'
      tags:
      - Admin-Notification
  /api/v1/admin/notifications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Danh sách toàn bộ thông báo'
      tags:
      - Admin-Notification
  /api/v1/admin/notifications/send:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Gửi thông báo thủ công'
      tags:
      - Admin-Notification
  /api/v1/admin/notifications/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Thống kê thông báo'
      tags:
      - Admin-Notification
  /api/v1/admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway_service_internal_response.Envelope'
      summary: '[Admin] Danh sách người dùng'
      tags:
      - Admin-User
  /api/v1/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
